# Releases the package when a version tag (vX.Y.Z) is pushed. Packagist has no upload step: it reads the tag
# through the GitHub hook set on packagist.org, so no credential of ours is involved. This workflow runs the
# tests against the tagged commit and publishes a GitHub Release with the source archive, its notes taken from
# CHANGELOG.md and a provenance attestation. The `release` environment needs a reviewer's approval before the
# release job starts. Packagist itself picks the tag up as soon as it is pushed, so who may create `v*` tags is
# limited by a tag ruleset on this repository.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is a version on main, with a changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a version tag (vMAJOR.MINOR.PATCH)"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          v="${TAG#v}"
          grep -q "const VERSION = '$v';" AuthFI.php || { echo "::error::AuthFI::VERSION is not $v"; exit 1; }
          grep -Eq "^## \[?${v//./\.}\]?( |$)" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
          if grep -q '"version"' composer.json; then echo "::error::composer.json must not set a version: Packagist reads the tag"; exit 1; fi
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'
          extensions: curl, json, openssl, sodium
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: php test_authfi.php

  release:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source archive and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="${TAG#v}"
          mkdir -p out
          git archive --format=zip --prefix="authfi-php-sdk-$v/" -o "out/authfi-php-sdk-$v.zip" HEAD
          awk -v v="$v" 'BEGIN{a="## "v; b="## ["v"]"} $0==a || index($0,a" ")==1 || $0==b || index($0,b" ")==1 {f=1;next} /^## /{f=0} f' CHANGELOG.md > out/notes.md
          test -s out/notes.md || { echo "::error::no release notes for $v"; exit 1; }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.zip
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" out/*.zip --verify-tag --title "$TAG" --notes-file out/notes.md
